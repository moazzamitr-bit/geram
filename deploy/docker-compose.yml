# Geram on a single server: app + Caddy (automatic HTTPS for the domain).
# Used by deploy/install.sh; values come from /opt/geram/.env.production.
services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: geram-app:latest
    env_file: /opt/geram/.env.production
    restart: unless-stopped
    expose:
      - "3000"
    # A `docker network connect` done by hand is lost on every recreate.
    # Stay on the Supabase stack network so supabase-db and the API gateway
    # (supabase-envoy, also aliased as kong) keep resolving.
    networks:
      - default
      - supabase

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      GERAM_DOMAIN: ${GERAM_DOMAIN}
    # Lets Caddy reach the self-hosted Supabase gateway published on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  supabase:
    external: true
    name: supabase_default
