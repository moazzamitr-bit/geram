<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6F4F1" />
    <meta name="robots" content="noindex" />
    <title>بدون اتصال | گرم</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f4f1;
        color: #1c1917;
        font-family: Tahoma, system-ui, sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 420px);
      }
      img {
        width: 88px;
        height: 88px;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 22px;
        line-height: 1.5;
      }
      p {
        margin: 12px 0 0;
        color: #57534e;
        font-size: 15px;
        line-height: 1.9;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 24px;
        padding: 0 20px;
        border-radius: 12px;
        background: #161616;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="گرم" width="88" height="88" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>
        گرم برای دیدن قیمت و انجام معامله به اینترنت نیاز دارد. اطلاعات مالی برای استفادهٔ آفلاین ذخیره نمی‌شود.
      </p>
      <a href="/app/dashboard">تلاش دوباره</a>
    </main>
  </body>
</html>
